        function importBoard(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    const boardId = 'board_' + Date.now();
                    const wrapped = {};
                    wrapped[boardId] = data;
                    applyImportedState({ boards: wrapped, currentBoard: boardId }, false);
                } catch (err) {
                    showToast('Invalid JSON file', 'error');
                }
            };
            reader.readAsText(file);
        }

        function applyImportedState(state, fromNative) {
            if (typeof state === 'string') state = JSON.parse(state);
            if (!state || typeof state !== 'object') throw new Error('File is not a valid JSON object');

            let boards = null;
            let isFullBackup = false;

            if (state.boards && typeof state.boards === 'object' && Object.keys(state.boards).length) {
                boards = state.boards;
                isFullBackup = true;
            } else if (state.columns && state.cards) {
                const id = 'board_' + Date.now();
                boards = {};
                boards[id] = state;
                state = { boards: boards, currentBoard: id };
                isFullBackup = true;
            } else if (Object.keys(state).length && Object.keys(state).every(function(key) {
                return state[key] && typeof state[key] === 'object' && state[key].columns;
            })) {
                // A bare map of board id -> board object.
                boards = state;
                isFullBackup = true;
            }

            if (!boards) throw new Error('No boards found in file');

            const cleaned = {};
            Object.keys(boards).forEach(function(id) {
                const board = boards[id] || {};
                if (!board.columns || !board.cards) return;
                cleaned[id] = {
                    name: board.name || 'Imported Board',
                    columns: board.columns,
                    cards: board.cards,
                    separators: Array.isArray(board.separators) ? board.separators : []
                };
            });

            if (!Object.keys(cleaned).length) throw new Error('No valid boards found in file');

            APP.boards = cleaned;
            APP.currentBoard = (state.currentBoard && cleaned[state.currentBoard])
                ? state.currentBoard
                : Object.keys(cleaned)[0];
            APP.currentTheme = state.currentTheme || APP.currentTheme;
            document.body.setAttribute('data-theme', APP.currentTheme);

            if (state.settings && state.settings.appName) {
                APP.appName = state.settings.appName;
            } else if (state.appName) {
                APP.appName = state.appName;
            }

            if (Array.isArray(state.settings && state.settings.completionColumns)) {
                APP.completionColumns = state.settings.completionColumns.slice(0);
            } else if (Array.isArray(state.completionColumns)) {
                APP.completionColumns = state.completionColumns.slice(0);
            } else {
                APP.completionColumns = [];
            }

            if (Array.isArray(state.columnOrder)) {
                const known = {};
                Object.keys(cleaned).forEach(function(boardId) {
                    Object.keys(cleaned[boardId].columns).forEach(function(colId) { known[colId] = true; });
                });
                const restored = state.columnOrder.filter(function(id) { return known[id]; });
                Object.keys(known).forEach(function(id) {
                    if (restored.indexOf(id) === -1) restored.push(id);
                });
                APP.columnOrder = restored;
            } else {
                rebuildColumnOrder();
            }

            normalizeAllBoards();
            applyAppName(APP.appName || 'KanbanFlow', false);
            saveData();
            updateBoardSelect();
            renderBoard();
            updateViewVisibility();
            updateFilterUI();
            closeModal();

            showToast(isFullBackup ? 'Backup imported into the database' : 'Board imported', 'success');
            if (fromNative) DB.requestInfo(function() {});
        }

        function rebuildColumnOrder() {
            const board = getBoard();
            if (!board) return;
            const ids = Object.keys(board.columns || {}).sort(function(a, b) {
                return (board.columns[a].order || 0) - (board.columns[b].order || 0);
            });
            APP.columnOrder = ids;
        }

        // ==================== RENDERING ====================
        var SEPARATOR_EDIT = { id: null, before: 'end' };
        var ADD_COLUMN_BEFORE = 'end';

        function renderAddColumnSpot(beforeCol) {
            return `
                <button type="button" class="add-column-spot" onclick="showAddColumnAtModal('${beforeCol}')" title="Add a column to the left of this divider">
                    <span class="acs-plus">+</span>
                    <span class="acs-label">Add column</span>
                </button>
            `;
        }

        function renderSeparatorHandle(beforeCol) {
            return `
                <div class="separator-handle">
                    <button type="button" onclick="showSeparatorModal(null, '${beforeCol}')" title="Add date divider">+</button>
                </div>
            `;
        }

        function renderSeparatorElement(sep) {
            const color = sep.color || '#e94558';
            return `
                <div class="date-separator" data-separator-id="${sep.id}" style="--sep-color:${color}">
                    <button type="button" class="date-separator-label" onclick="showSeparatorModal('${sep.id}')" title="Edit divider">${escapeHtml(sep.label || 'Divider')}</button>
                    <div class="date-separator-line"></div>
                    <button type="button" class="date-separator-edit" onclick="showSeparatorModal('${sep.id}')" title="Edit divider">✎</button>
                </div>
            `;
        }

        function showSeparatorModal(sepId, beforeCol) {
            const board = getBoard();
            if (!board) return;
            if (!board.separators) board.separators = [];

            const sep = sepId ? board.separators.filter(function(s) { return s.id === sepId; })[0] : null;
            SEPARATOR_EDIT.id = sep ? sep.id : null;
            SEPARATOR_EDIT.before = sep ? sep.before : (beforeCol || 'end');

            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');
            const footer = document.getElementById('modalFooter');

            title.textContent = sep ? 'Edit Date Divider' : 'Add Date Divider';

            const ordered = APP.columnOrder.filter(function(id) { return board.columns[id]; });
            let positionOptions = '';
            ordered.forEach(function(id) {
                positionOptions += '<option value="' + id + '"' + (SEPARATOR_EDIT.before === id ? ' selected' : '') + '>Before "' + escapeHtml(board.columns[id].title) + '"</option>';
            });
            if (ordered.length > 0) {
                positionOptions += '<option value="end"' + (SEPARATOR_EDIT.before === 'end' ? ' selected' : '') + '>At the right edge</option>';
            }

            const colors = ['#e94558', '#ffc107', '#4ecca2', '#4a90d9', '#a855f7', '#e8e8e8'];

            body.innerHTML = `
                <div class="detail-section">
                    <div class="detail-section-title">Caption</div>
                    <input type="text" class="detail-input" id="separatorLabel" maxlength="40" placeholder="e.g. Mon, 14 Nov">
                </div>
                <div class="detail-section">
                    <div class="detail-section-title">Line color</div>
                    <div class="separator-color-row">
                        <input type="color" class="separator-color-input" id="separatorColor" value="${sep && sep.color ? sep.color : '#e94558'}">
                        ${colors.map(function(c) {
                            return '<button type="button" class="separator-swatch" data-color="' + c + '" style="background:' + c + '" onclick="setSeparatorColor(\'' + c + '\')"></button>';
                        }).join('')}
                    </div>
                </div>
                <div class="detail-section">
                    <div class="detail-section-title">Position</div>
                    ${ordered.length > 0
                        ? '<select class="detail-input" id="separatorPosition">' + positionOptions + '</select>'
                        : '<div class="detail-label">Add a column first.</div>'}
                </div>
            `;

            if (sep) {
                document.getElementById('separatorLabel').value = sep.label || '';
            }
            updateSeparatorSwatches(document.getElementById('separatorColor').value);

            footer.innerHTML = (sep ? '<button class="btn" onclick="deleteSeparator()">Delete</button>' : '') +
                '<button class="btn" onclick="closeModal()">Cancel</button>' +
                '<button class="btn btn-primary" onclick="saveSeparator()">Save</button>';

            showModal();
        }

        function updateSeparatorSwatches(color) {
            const swatches = document.querySelectorAll('.separator-swatch');
            for (let i = 0; i < swatches.length; i++) {
                const c = (swatches[i].getAttribute('data-color') || '').toLowerCase();
                if (c === (color || '').toLowerCase()) swatches[i].classList.add('selected');
                else swatches[i].classList.remove('selected');
            }
        }

        function setSeparatorColor(color) {
            const input = document.getElementById('separatorColor');
            if (input) input.value = color;
            updateSeparatorSwatches(color);
        }

        function saveSeparator() {
            const board = getBoard();
            if (!board) return;
            if (!board.separators) board.separators = [];

            const labelEl = document.getElementById('separatorLabel');
            const label = labelEl ? labelEl.value.trim() : '';
            const colorEl = document.getElementById('separatorColor');
            const color = colorEl ? colorEl.value : '#e94558';
            const posEl = document.getElementById('separatorPosition');
            const before = posEl ? posEl.value : 'end';

            if (!label) {
                showToast('Please enter a caption', 'error');
                return;
            }

            if (SEPARATOR_EDIT.id) {
                const sep = board.separators.filter(function(s) { return s.id === SEPARATOR_EDIT.id; })[0];
                if (sep) {
                    sep.label = label;
                    sep.color = color;
                    sep.before = before;
                }
            } else {
                board.separators.push({
                    id: 'sep_' + Date.now(),
                    label: label,
                    color: color,
                    before: before
                });
            }

            saveData();
            closeModal();
            renderBoard();
            showToast('Date divider saved', 'success');
        }

        function deleteSeparator() {
            const board = getBoard();
            if (!board || !board.separators) { closeModal(); return; }
            board.separators = board.separators.filter(function(s) { return s.id !== SEPARATOR_EDIT.id; });
            saveData();
            closeModal();
            renderBoard();
            showToast('Date divider removed', 'info');
        }

        function renderBoard() {
            renderBoardContent();
            if (APP.view === 'calendar') renderCalendar();
            else if (APP.view === 'projects') renderProjects();
        }

        function renderBoardContent() {
            const container = document.getElementById('boardContainer');
            const board = getBoard();

            if (!board) {
                container.innerHTML = '<div class="empty-state">No board selected</div>';
                return;
            }

            const orderedColumns = APP.columnOrder.filter(function(id) { return board.columns[id]; });

            if (!board.separators) board.separators = [];
            const separators = board.separators;

            if (orderedColumns.length === 0) {
                container.innerHTML = '<div class="empty-state">No columns yet. Add a column to get started.</div>';
                return;
            }

            let html = '';

            orderedColumns.forEach(function(colId, index) {
                const colSeps = separators.filter(function(s) { return s.before === colId; });
                if (colSeps.length > 0) {
                    colSeps.forEach(function(sep) {
                        html += renderAddColumnSpot(sep.before);
                        html += renderSeparatorElement(sep);
                    });
                } else if (index > 0) {
                    html += renderSeparatorHandle(colId);
                }

                const col = board.columns[colId];
                const cards = board.cards[colId] || [];

                html += `
                    <div class="column" data-column="${colId}" draggable="true">
                        <div class="column-header" data-column="${colId}">
                            <div class="column-title">
                                ${col.title}
                                <span class="column-count">(${cards.length})</span>
                            </div>
                            <div class="column-actions">
                                <button class="column-action-btn" onclick="duplicateColumn('${colId}')" title="Duplicate column">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <rect x="9" y="9" width="11" height="11" rx="2"/>
                                        <path d="M5 15H4a1 1 0 01-1-1V4a1 1 0 011-1h10a1 1 0 011 1v1"/>
                                    </svg>
                                </button>
                                <button class="column-action-btn" onclick="editColumnTitle('${colId}')" title="Edit">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M12 20h-7a1 1 0 01-1-1v-3a1 1 0 011-1h2.5L13.5 10.5M14 6.5L5.5 15h6.5L14 6.5z"/>
                                    </svg>
                                </button>
                                <button class="column-action-btn" onclick="deleteColumn('${colId}')" title="Delete">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M3 6h18M16 6V4M8 6V4M14 10v8M6 10v8"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <div class="column-body" data-column-body="${colId}"></div>
                        <div class="add-card-form">
                            <button class="add-card-btn" onclick="showAddCardForm('${colId}')">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M12 5v14M5 12h14"/>
                                </svg>
                                Add Card
                            </button>
                        </div>
                    </div>
                `;
            });

            separators.filter(function(s) { return s.before === 'end'; }).forEach(function(sep) {
                html += renderAddColumnSpot('end');
                html += renderSeparatorElement(sep);
            });

            html += `
                <div class="column add-column-col" id="addNewColumn">
                    <div class="column-body" onclick="showAddColumnForm()">
                        <div class="add-column-text">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 5v14M5 12h14"/>
                            </svg>
                            Add Column
                        </div>
                    </div>
                </div>
            `;

            container.innerHTML = html;

            document.querySelectorAll('.column-body[data-column-body]').forEach(function(body) {
                const colId = body.dataset.columnBody;
                const board = getBoard();
                const cards = board.cards[colId] || [];
                const filteredCards = filterCards(cards);

                body.innerHTML = filteredCards.map(function(card) { return renderCard(card); }).join('');

                if (filteredCards.length === 0 && APP.searchQuery) {
                    body.innerHTML += '<div class="empty-state" style="padding:12px;font-size:12px;">No matching cards</div>';
                }
            });

            setupDragAndDrop();
            setupTouchCardDrag();
        }

        function renderCard(card) {
            const isOverdue = isCardOverdue(card);
            const labelClass = card.label ? `label-${card.label}` : '';
            const priorityClass = card.priority ? `priority-${card.priority}` : '';
            const hasRange = !!(card.dueDate && card.dueDateEnd && card.dueDateEnd !== card.dueDate);

            const progressPercent = card.subtasksTotal > 0 ? (card.subtasks / card.subtasksTotal) * 100 : 0;

            return `
                <div class="card ${card.id}${card.label ? ' card-tint-' + card.label : ''}" draggable="true" data-card-id="${card.id}">
                    <div class="card-header">
                        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                            ${card.label ? `<span class="card-label ${labelClass}">${card.label}</span>` : ''}
                            ${card.priority ? `<span class="card-priority ${priorityClass}">${card.priority}</span>` : ''}
                        </div>
                        <div class="card-actions">
                            ${card.completed ? `<button class="card-completed-check" onclick="uncompleteCard('${card.id}')" title="Completed — click to undo">✓</button>` : ''}
                            <button class="card-action-btn complete-btn${card.completed ? ' active' : ''}" onclick="showCompleteModal('${card.id}')" title="${card.completed ? 'Completion options' : 'Finish task'}">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M20 6L9 17l-5-5"/>
                                </svg>
                            </button>
                            <button class="card-action-btn" onclick="showCardDetail('${card.id}')" title="View Details">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="12" cy="12" r="10"/>
                                    <circle cx="12" cy="12" r="4"/>
                                </svg>
                            </button>
                            <button class="card-action-btn" onclick="deleteCard('${card.id}')" title="Delete">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                                    <path d="M18 6L6 18M6 6l12 12"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="card-title">${escapeHtml(card.title)}</div>
                    ${card.description ? `<div class="card-description">${escapeHtml(truncate(card.description, 60))}</div>` : ''}
                    ${card.dueDate ? `<div class="card-due ${isOverdue ? 'overdue' : ''} ${hasRange ? 'range' : ''}">
                        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                            <line x1="16" y1="2" x2="16" y2="6"/>
                            <line x1="8" y1="2" x2="8" y2="6"/>
                            <line x1="3" y1="10" x2="21" y2="10"/>
                        </svg>
                        <span>${card.dueDate}</span>
                        ${hasRange ? `<span class="due-arrow">→</span><span>${card.dueDateEnd}</span>` : ''}
                    </div>` : ''}
                    ${card.subtasksTotal > 0 ? `<div style="margin-top:6px;">
                        <div style="height:4px;background:var(--border);border-radius:2px;">
                            <div style="height:100%;width:${progressPercent}%;background:var(--accent);border-radius:2px;"></div>
                        </div>
                        <div style="font-size:10px;color:var(--text-secondary);margin-top:2px;">${card.subtasks}/${card.subtasksTotal} tasks</div>
                    </div>` : ''}
                    <div class="card-footer">
                        ${card.assignee ? `<div style="display:flex;align-items:center;gap:4px;">
                            <span style="font-size:14px;">${card.avatar || '👤'}</span>
                            <span style="font-size:11px;">${card.assignee}</span>
                        </div>` : ''}
                        <div class="card-stats">
                            ${(card.comments ? card.comments.length : 0) ? `<span class="card-stat" title="${card.comments.length} comments">
                                💬${card.comments.length}
                            </span>` : ''}
                            ${(card.activity && card.activity.length > 0) ? `<span class="card-stat">📋</span>` : ''}
                        </div>
                    </div>
                </div>
            `;
        }

        function filterCards(cards) {
            const filters = APP.activeFilters || { labels: [], assignees: [], priorities: [] };
            if (!APP.searchQuery &&
                filters.labels.length === 0 &&
                filters.assignees.length === 0 &&
                filters.priorities.length === 0) {
                return cards;
            }

            return cards.filter(function(card) {
                const query = (APP.searchQuery || '').toLowerCase();
                const matchesSearch = !query ||
                    (card.title || '').toLowerCase().includes(query) ||
                    (card.description && card.description.toLowerCase().includes(query));

                const matchesLabel = filters.labels.length === 0 || filters.labels.includes(card.label);
                const matchesAssignee = filters.assignees.length === 0 || filters.assignees.includes(card.assignee);
                const matchesPriority = filters.priorities.length === 0 || filters.priorities.includes(card.priority);

                return matchesSearch && matchesLabel && matchesAssignee && matchesPriority;
            });
        }

        
        // ==================== VIEW SWITCHER ====================
        function setView(view) {
            APP.view = view;
            updateViewVisibility();

            if (view === 'board') {
                renderBoardContent();
            } else if (view === 'calendar') {
                renderCalendar();
            } else if (view === 'projects') {
                renderProjects();
            }
        }

        function updateViewVisibility() {
            const boardEl = document.getElementById('boardContainer');
            const calEl = document.getElementById('calendarView');
            const projEl = document.getElementById('projectView');

            if (boardEl) boardEl.style.display = APP.view === 'board' ? '' : 'none';
            if (calEl) calEl.classList.toggle('active', APP.view === 'calendar');
            if (projEl) projEl.classList.toggle('active', APP.view === 'projects');

            document.querySelectorAll('.view-btn').forEach(function(btn) {
                btn.classList.toggle('active', btn.getAttribute('data-view') === APP.view);
            });

            const sepBtn = document.getElementById('addSeparatorBtn');
            if (sepBtn) sepBtn.style.display = APP.view === 'board' ? '' : 'none';
        }

        // ==================== CALENDAR VIEW ====================
        function formatDateKey(date) {
            const m = date.getMonth() + 1;
            const d = date.getDate();
            return date.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (d < 10 ? '0' : '') + d;
        }

        function parseDateKey(key) {
            if (!key) return null;
            const match = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(key));
            if (!match) return null;
            const date = new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
            return isNaN(date.getTime()) ? null : date;
        }

        // ==================== DATE PICKER POPOVER ====================
        // A custom calendar replaces the native date input so it can open
        // upwards near the bottom of the screen instead of being clipped.
        const DATE_PICKER = { input: null, cursor: null };

        function datePickerElement() {
            return document.getElementById('datePickerPopover');
        }

        function openDatePicker(input) {
            const popover = datePickerElement();
            if (!popover || !input) return;

            DATE_PICKER.input = input;
            const selected = parseDateKey(input.value);
            const base = selected || new Date();
            DATE_PICKER.cursor = new Date(base.getFullYear(), base.getMonth(), 1);

            popover.classList.add('open');
            renderDatePicker();
            positionDatePicker(input, popover);
        }

        function positionDatePicker(input, popover) {
            if (!input || !popover) return;
            const rect = input.getBoundingClientRect();
            const margin = 8;
            const gap = 6;
            const width = popover.offsetWidth || 286;
            const height = popover.offsetHeight || 320;

            let left = Math.min(Math.max(margin, rect.left), window.innerWidth - width - margin);
            let top = rect.bottom + gap;

            // No room below: open upwards instead.
            if (top + height > window.innerHeight - margin) {
                top = rect.top - height - gap;
            }
            if (top < margin) {
                top = Math.max(margin, window.innerHeight - height - margin);
            }

            popover.style.left = Math.round(left) + 'px';
            popover.style.top = Math.round(top) + 'px';
        }

        function renderDatePicker() {
            const popover = datePickerElement();
            if (!popover || !DATE_PICKER.input) return;

            const cursor = DATE_PICKER.cursor || new Date();
            const year = cursor.getFullYear();
            const month = cursor.getMonth();
            const monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
                'July', 'August', 'September', 'October', 'November', 'December'];
            const todayKey = formatDateKey(new Date());
            const selectedKey = DATE_PICKER.input.value || '';

            const offset = (new Date(year, month, 1).getDay() + 6) % 7;
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const cells = [];
            for (let i = 0; i < offset; i++) cells.push(null);
            for (let d = 1; d <= daysInMonth; d++) cells.push(d);
            while (cells.length % 7 !== 0) cells.push(null);
            while (cells.length < 42) cells.push(null);

            const weekdays = ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su']
                .map(function(day) { return '<span>' + day + '</span>'; }).join('');

            const days = cells.map(function(day) {
                if (!day) return '<button type="button" class="date-picker-day empty" tabindex="-1"></button>';
                const key = formatDateKey(new Date(year, month, day));
                const classes = 'date-picker-day' +
                    (key === todayKey ? ' today' : '') +
                    (key === selectedKey ? ' selected' : '');
                return '<button type="button" class="' + classes + '" data-date-day="' + day + '">' + day + '</button>';
            }).join('');

            popover.innerHTML = `
                <div class="date-picker-header">
                    <button type="button" class="date-picker-nav" data-date-nav="-1" aria-label="Previous month">‹</button>
                    <div class="date-picker-title">${monthNames[month]} ${year}</div>
                    <button type="button" class="date-picker-nav" data-date-nav="1" aria-label="Next month">›</button>
                </div>
                <div class="date-picker-weekdays">${weekdays}</div>
                <div class="date-picker-grid">${days}</div>
                <div class="date-picker-footer">
                    <button type="button" class="date-picker-link" data-date-today>Today</button>
                    <button type="button" class="date-picker-link" data-date-clear>Clear</button>
                </div>
            `;
        }

        let suppressDatePickerFocus = false;

        function applyDatePickerValue(key) {
            const input = DATE_PICKER.input;
            if (!input) return;
            input.value = key;
            input.dispatchEvent(new Event('change', { bubbles: true }));
            closeDatePicker();

            // Return focus to the field without immediately reopening the
            // calendar through the focus handler.
            suppressDatePickerFocus = true;
            input.focus();
            setTimeout(function() { suppressDatePickerFocus = false; }, 0);
        }

        function closeDatePicker() {
            const popover = datePickerElement();
            if (popover) popover.classList.remove('open');
            DATE_PICKER.input = null;
        }

        let datePickersReady = false;

        function setupDatePickers() {
            const popover = datePickerElement();
            if (!popover || datePickersReady) return;
            datePickersReady = true;

            document.addEventListener('click', function(e) {
                const input = e.target && e.target.closest ? e.target.closest('.date-input') : null;
                if (input) {
                    openDatePicker(input);
                    return;
                }
                if (!e.target || !e.target.closest || !e.target.closest('.date-picker-popover')) {
                    closeDatePicker();
                }
            });

            document.addEventListener('focusin', function(e) {
                if (suppressDatePickerFocus) return;
                if (e.target && e.target.classList && e.target.classList.contains('date-input')) {
                    openDatePicker(e.target);
                }
            });

            // Keep focus on the date field; the calendar buttons should not
            // take it while the popover closes.
            popover.addEventListener('mousedown', function(e) {
                if (e.target.closest('button')) e.preventDefault();
            });

            popover.addEventListener('click', function(e) {
                const nav = e.target.closest('[data-date-nav]');
                if (nav && DATE_PICKER.cursor) {
                    DATE_PICKER.cursor.setMonth(DATE_PICKER.cursor.getMonth() + Number(nav.getAttribute('data-date-nav')));
                    renderDatePicker();
                    positionDatePicker(DATE_PICKER.input, popover);
                    return;
                }

                const day = e.target.closest('[data-date-day]');
                if (day) {
                    const cursor = DATE_PICKER.cursor;
                    const dayNumber = Number(day.getAttribute('data-date-day'));
                    applyDatePickerValue(formatDateKey(new Date(cursor.getFullYear(), cursor.getMonth(), dayNumber)));
                    return;
                }

                if (e.target.closest('[data-date-today]')) {
                    applyDatePickerValue(formatDateKey(new Date()));
                    return;
                }

                if (e.target.closest('[data-date-clear]')) {
                    applyDatePickerValue('');
                }
            });

            window.addEventListener('resize', closeDatePicker);
            window.addEventListener('scroll', closeDatePicker, true);
        }

        function addDaysToKey(key, days) {
            const date = parseDateKey(key);
            if (!date) return '';
            date.setDate(date.getDate() + days);
            return formatDateKey(date);
        }

        function daysBetweenKeys(startKey, endKey) {
            const start = parseDateKey(startKey);
            const end = parseDateKey(endKey);
            if (!start || !end) return 0;
            return Math.round((end.getTime() - start.getTime()) / 86400000);
        }

        function eachRangeDay(startKey, endKey) {
            const start = parseDateKey(startKey);
            if (!start) return [];
            const end = parseDateKey(endKey);
            const last = (end && end >= start) ? end : start;
            const days = [];
            const cursor = new Date(start.getFullYear(), start.getMonth(), start.getDate());
            let guard = 0;
            while (cursor <= last && guard < 370) {
                days.push(formatDateKey(cursor));
                cursor.setDate(cursor.getDate() + 1);
                guard++;
            }
            return days;
        }

        function dueRangeLabel(card) {
            if (!card || !card.dueDate) return '';
            const end = card.dueDateEnd || '';
            if (!end || end === card.dueDate) return card.dueDate;
            return card.dueDate + ' → ' + end;
        }

        function dueReferenceDate(card) {
            if (!card) return '';
            return card.dueDateEnd || card.dueDate || '';
        }

        function isCardOverdue(card) {
            const ref = dueReferenceDate(card);
            if (!ref) return false;
            const date = parseDateKey(ref);
            if (!date) return false;
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            return date < today;
        }

        function renderCalendarTask(entry) {
            const card = entry.card || entry;
            const rangePos = entry.rangePos || '';
            const colors = {
                red: 'var(--danger)',
                green: 'var(--success)',
                blue: 'var(--info)',
                yellow: 'var(--warning)',
                purple: '#a855f7'
            };
            const color = colors[card.label] || 'var(--accent)';
            const rawTitle = card.title || 'Untitled';
            const title = escapeHtml(rawTitle);
            const rangeTitle = dueRangeLabel(card) || rawTitle;
            const tooltip = escapeHtml(rangeTitle).replace(/"/g, '&quot;');

            const rangeClass = rangePos ? ' cal-range-' + rangePos : '';
            const continuation = (rangePos === 'mid' || rangePos === 'end')
                ? '<span class="cal-range-cont">↳</span>'
                : '';
            const rangeBadge = (card.dueDateEnd && card.dueDateEnd !== card.dueDate && (rangePos === '' || rangePos === 'start'))
                ? '<span class="cal-task-range" title="' + tooltip + '">→</span>'
                : '';

            const completedMark = card.completed
                ? '<span class="cal-task-completed" title="Completed">✓</span>'
                : '';

            return `<div class="cal-task${rangeClass}" draggable="true" data-card-id="${card.id}" style="border-left-color:${color}" onclick="openCalendarCard(event, '${card.id}')" title="${tooltip}">
                ${continuation}<span class="cal-task-title">${title}</span>${completedMark}${rangeBadge}
            </div>`;
        }

        function openCalendarCard(e, cardId) {
            if (e) e.stopPropagation();
            if (CAL_SUPPRESS_CLICK) {
                CAL_SUPPRESS_CLICK = false;
                return;
            }
            showCardDetail(cardId);
        }

        function onCalendarDayClick(e, dateKey) {
            // Task clicks stop propagation, and drag/drop sets this flag.
            if (CAL_SUPPRESS_CLICK) {
                CAL_SUPPRESS_CLICK = false;
                return;
            }
            if (e && e.target && closestElement(e.target, '.cal-task')) return;
            showAddCalendarCardModal(dateKey);
        }

        function renderCalendar() {
            const container = document.getElementById('calendarView');
            const board = getBoard();
            if (!container) return;

            if (!board) {
                container.innerHTML = '<div class="empty-state">No board selected</div>';
                return;
            }

            if (!APP.calendarCursor) {
                const now = new Date();
                APP.calendarCursor = new Date(now.getFullYear(), now.getMonth(), 1);
            }

            const cursor = APP.calendarCursor;
            const monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
                'July', 'August', 'September', 'October', 'November', 'December'];
            const weekdays = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

            const year = cursor.getFullYear();
            const month = cursor.getMonth();
            const firstDay = new Date(year, month, 1);
            const startOffset = (firstDay.getDay() + 6) % 7; // Monday = 0
            const gridStart = new Date(year, month, 1 - startOffset);

            const ordered = APP.columnOrder.filter(function(id) { return board.columns[id]; });
            const entries = [];
            ordered.forEach(function(colId) {
                const cards = filterCards(board.cards[colId] || []);
                cards.forEach(function(card) {
                    entries.push({ card: card, column: colId });
                });
            });

            const tasksByDate = {};
            const undated = [];
            entries.forEach(function(entry) {
                const due = entry.card.dueDate ? String(entry.card.dueDate).slice(0, 10) : '';
                if (!due) {
                    undated.push(entry);
                    return;
                }
                const end = entry.card.dueDateEnd ? String(entry.card.dueDateEnd).slice(0, 10) : '';
                const days = eachRangeDay(due, end);
                days.forEach(function(dayKey, index) {
                    let rangePos = '';
                    if (days.length > 1) {
                        if (index === 0) rangePos = 'start';
                        else if (index === days.length - 1) rangePos = 'end';
                        else rangePos = 'mid';
                    }
                    if (!tasksByDate[dayKey]) tasksByDate[dayKey] = [];
                    tasksByDate[dayKey].push({ card: entry.card, column: entry.column, rangePos: rangePos });
                });
            });

            const todayKey = formatDateKey(new Date());
            let cells = '';

            // Always render six full weeks so the grid keeps its 7-day lines.
            for (let i = 0; i < 42; i++) {
                const day = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
                const key = formatDateKey(day);
                const otherMonth = day.getMonth() !== month;
                const dayTasks = tasksByDate[key] || [];

                cells += `<div class="cal-day${otherMonth ? ' other-month' : ''}${key === todayKey ? ' today' : ''}" data-date="${key}" onclick="onCalendarDayClick(event, '${key}')" title="Click to add a task on this day">
                    <div class="cal-day-num">${day.getDate()}</div>
                    <div class="cal-day-tasks">${dayTasks.map(function(entry) { return renderCalendarTask(entry); }).join('')}</div>
                </div>`;
            }

            container.innerHTML = `
                <div class="calendar-shell">
                    <div class="calendar-toolbar">
                        <div class="calendar-title">${monthNames[month]} ${year}</div>
                        <div class="calendar-nav">
                            <button type="button" class="cal-nav-btn" onclick="calendarPrevMonth()" title="Previous month">‹</button>
                            <button type="button" class="cal-nav-btn" onclick="calendarToday()">Today</button>
                            <button type="button" class="cal-nav-btn" onclick="calendarNextMonth()" title="Next month">›</button>
                        </div>
                    </div>
                    <div class="cal-weekdays">
                        ${weekdays.map(function(w) { return '<div class="cal-weekday">' + w + '</div>'; }).join('')}
                    </div>
                    <div class="calendar-grid">${cells}</div>
                    <div class="cal-undated" id="calUndated">
                        <span class="cal-undated-label">No date</span>
                        ${undated.length
                            ? undated.map(function(entry) { return renderCalendarTask(entry); }).join('')
                            : '<span class="cal-undated-empty">Drop a card here to remove its due date</span>'}
                    </div>
                </div>
            `;

            setupCalendarDrag();
        }

        function calendarPrevMonth() {
            if (!APP.calendarCursor) APP.calendarCursor = new Date();
            APP.calendarCursor = new Date(APP.calendarCursor.getFullYear(), APP.calendarCursor.getMonth() - 1, 1);
            renderCalendar();
        }

        function calendarNextMonth() {
            if (!APP.calendarCursor) APP.calendarCursor = new Date();
            APP.calendarCursor = new Date(APP.calendarCursor.getFullYear(), APP.calendarCursor.getMonth() + 1, 1);
            renderCalendar();
        }

        function calendarToday() {
            const now = new Date();
            APP.calendarCursor = new Date(now.getFullYear(), now.getMonth(), 1);
            renderCalendar();
        }

        function setCardDueDate(cardId, date) {
            const result = getCard(cardId);
            if (!result) return;

            const card = result.card;
            const oldStart = card.dueDate || '';
            const oldEnd = card.dueDateEnd || '';
            let newEnd = '';

            if (date && oldStart && oldEnd) {
                // Keep the duration when a multi-day card is dragged.
                const duration = Math.max(0, daysBetweenKeys(oldStart, oldEnd));
                if (duration > 0) newEnd = addDaysToKey(date, duration);
            }

            if (oldStart === (date || '') && oldEnd === newEnd) return;

            updateCard(cardId, { dueDate: date || '', dueDateEnd: newEnd });

            if (!date) {
                showToast('Due date removed', 'info');
            } else if (newEnd) {
                showToast('Date range set to ' + date + ' → ' + newEnd, 'info');
            } else {
                showToast('Due date set to ' + date, 'info');
            }
        }

        var CAL_DRAG = { cardId: null };
        var CAL_SUPPRESS_CLICK = false;
        var CAL_TOUCH = {
            card: null, cardId: null, ghost: null,
            startX: 0, startY: 0, lastX: 0, lastY: 0,
            offsetX: 0, offsetY: 0,
            active: false, timer: null, target: null
        };

        function setupCalendarDrag() {
            const tasks = document.querySelectorAll('#calendarView .cal-task');
            for (let i = 0; i < tasks.length; i++) {
                const task = tasks[i];

                task.addEventListener('dragstart', function(e) {
                    CAL_DRAG.cardId = task.getAttribute('data-card-id');
                    CAL_SUPPRESS_CLICK = true;
                    e.stopPropagation();
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', CAL_DRAG.cardId);
                    task.classList.add('cal-task-dragging');
                });

                task.addEventListener('dragend', function() {
                    task.classList.remove('cal-task-dragging');
                    const drops = document.querySelectorAll('.cal-drop');
                    for (let k = 0; k < drops.length; k++) drops[k].classList.remove('cal-drop');
                    CAL_DRAG.cardId = null;
                    setTimeout(function() { CAL_SUPPRESS_CLICK = false; }, 100);
                });

                task.addEventListener('touchstart', onCalTouchStart, false);
                task.addEventListener('touchmove', onCalTouchMove, false);
                task.addEventListener('touchend', onCalTouchEnd, false);
                task.addEventListener('touchcancel', onCalTouchCancel, false);
            }

            const zones = document.querySelectorAll('#calendarView .cal-day[data-date], #calendarView .cal-undated');
            for (let j = 0; j < zones.length; j++) {
                const zone = zones[j];

                zone.addEventListener('dragover', function(e) {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    zone.classList.add('cal-drop');
                });

                zone.addEventListener('dragleave', function() {
                    zone.classList.remove('cal-drop');
                });

                zone.addEventListener('drop', function(e) {
                    e.preventDefault();
                    zone.classList.remove('cal-drop');
                    const cardId = CAL_DRAG.cardId || e.dataTransfer.getData('text/plain');
                    if (!cardId) return;
                    const date = zone.getAttribute('data-date') || '';
                    setCardDueDate(cardId, date);
                });
            }
        }

        function onCalTouchStart(e) {
            if (!e.touches || e.touches.length !== 1) return;
            const task = closestElement(e.target, '.cal-task');
            if (!task) return;

            const t = e.touches[0];
            CAL_TOUCH.card = task;
            CAL_TOUCH.cardId = task.getAttribute('data-card-id');
            CAL_TOUCH.startX = t.clientX;
            CAL_TOUCH.startY = t.clientY;
            CAL_TOUCH.lastX = t.clientX;
            CAL_TOUCH.lastY = t.clientY;
            CAL_TOUCH.active = false;
            CAL_TOUCH.target = null;

            clearTimeout(CAL_TOUCH.timer);
            CAL_TOUCH.timer = setTimeout(function() { startCalTouchDrag(); }, 200);
        }

        function startCalTouchDrag() {
            if (!CAL_TOUCH.card) return;

            CAL_TOUCH.active = true;
            CAL_SUPPRESS_CLICK = true;

            const rect = CAL_TOUCH.card.getBoundingClientRect();
            const ghost = CAL_TOUCH.card.cloneNode(true);
            ghost.className = 'cal-task cal-touch-ghost';
            ghost.style.position = 'fixed';
            ghost.style.left = rect.left + 'px';
            ghost.style.top = rect.top + 'px';
            ghost.style.width = rect.width + 'px';
            ghost.style.zIndex = '10001';
            ghost.style.pointerEvents = 'none';
            ghost.style.opacity = '0.92';
            document.body.appendChild(ghost);

            CAL_TOUCH.ghost = ghost;
            CAL_TOUCH.offsetX = CAL_TOUCH.lastX - rect.left;
            CAL_TOUCH.offsetY = CAL_TOUCH.lastY - rect.top;
            CAL_TOUCH.card.classList.add('cal-task-dragging');
            updateCalTouchTarget(CAL_TOUCH.lastX, CAL_TOUCH.lastY);
        }

        function onCalTouchMove(e) {
            if (!e.touches || e.touches.length !== 1) return;

            const t = e.touches[0];
            CAL_TOUCH.lastX = t.clientX;
            CAL_TOUCH.lastY = t.clientY;

            if (!CAL_TOUCH.active) {
                if (Math.abs(t.clientX - CAL_TOUCH.startX) > 10 || Math.abs(t.clientY - CAL_TOUCH.startY) > 10) {
                    clearTimeout(CAL_TOUCH.timer);
                    CAL_TOUCH.card = null;
                }
                return;
            }

            if (e.preventDefault) e.preventDefault();
            if (CAL_TOUCH.ghost) {
                CAL_TOUCH.ghost.style.left = (t.clientX - CAL_TOUCH.offsetX) + 'px';
                CAL_TOUCH.ghost.style.top = (t.clientY - CAL_TOUCH.offsetY) + 'px';
            }
            updateCalTouchTarget(t.clientX, t.clientY);
        }

        function updateCalTouchTarget(x, y) {
            const el = document.elementFromPoint(x, y);
            const zone = el ? closestElement(el, '.cal-day[data-date], .cal-undated') : null;

            if (CAL_TOUCH.target && CAL_TOUCH.target !== zone) {
                CAL_TOUCH.target.classList.remove('cal-drop');
            }
            CAL_TOUCH.target = zone;
            if (zone) zone.classList.add('cal-drop');
        }

        function onCalTouchEnd(e) {
            clearTimeout(CAL_TOUCH.timer);
            if (!CAL_TOUCH.active) {
                CAL_TOUCH.card = null;
                return;
            }

            if (e && e.preventDefault) e.preventDefault();
            const zone = CAL_TOUCH.target;
            const cardId = CAL_TOUCH.cardId;

            cleanupCalTouchDrag();

            if (zone && cardId) {
                const date = zone.getAttribute('data-date') || '';
                setCardDueDate(cardId, date);
            }

            setTimeout(function() { CAL_SUPPRESS_CLICK = false; }, 350);
        }

        function onCalTouchCancel() {
            clearTimeout(CAL_TOUCH.timer);
            cleanupCalTouchDrag();
        }

        function cleanupCalTouchDrag() {
            if (CAL_TOUCH.ghost && CAL_TOUCH.ghost.parentNode) {
                CAL_TOUCH.ghost.parentNode.removeChild(CAL_TOUCH.ghost);
            }
            if (CAL_TOUCH.card) CAL_TOUCH.card.classList.remove('cal-task-dragging');

            const drops = document.querySelectorAll('.cal-drop');
            for (let i = 0; i < drops.length; i++) drops[i].classList.remove('cal-drop');

            CAL_TOUCH.card = null;
            CAL_TOUCH.cardId = null;
            CAL_TOUCH.ghost = null;
            CAL_TOUCH.target = null;
            CAL_TOUCH.active = false;
        }

        // ==================== PROJECT VIEW ====================
        function renderProjects() {
            const container = document.getElementById('projectView');
            const board = getBoard();
            if (!container) return;

            if (!board) {
                container.innerHTML = '<div class="empty-state">No board selected</div>';
                return;
            }

            const ordered = APP.columnOrder.filter(function(id) { return board.columns[id]; });
            let html = '';

            ordered.forEach(function(colId) {
                const cards = filterCards(board.cards[colId] || []);
                html += `<section class="project-group">
                    <div class="project-group-header">
                        <span>${escapeHtml(board.columns[colId].title)}</span>
                        <span class="project-group-count">${cards.length}</span>
                    </div>
                    <div class="project-grid">
                        ${cards.length
                            ? cards.map(function(card) { return renderProjectTile(card); }).join('')
                            : '<div class="project-empty">No projects in this group yet</div>'}
                    </div>
                </section>`;
            });

            container.innerHTML = html || '<div class="empty-state">No columns yet. Add a column to get started.</div>';
        }

        function renderProjectTile(card) {
            const isOverdue = isCardOverdue(card);
            const labelClass = card.label ? `label-${card.label}` : '';
            const priorityClass = card.priority ? `priority-${card.priority}` : '';
            const progressPercent = card.subtasksTotal > 0 ? (card.subtasks / card.subtasksTotal) * 100 : 0;

            return `<article class="project-tile${card.label ? ' card-tint-' + card.label : ''}" onclick="showCardDetail('${card.id}')">
                <div class="project-tile-tags">
                    ${card.completed ? '<span class="card-completed-check" title="Completed">✓</span>' : ''}
                    ${card.label ? `<span class="card-label ${labelClass}">${card.label}</span>` : ''}
                    ${card.priority ? `<span class="card-priority ${priorityClass}">${card.priority}</span>` : ''}
                </div>
                <h3 class="project-tile-title">${escapeHtml(card.title)}</h3>
                ${card.description ? `<p class="project-tile-desc">${escapeHtml(card.description)}</p>` : ''}
                ${card.subtasksTotal > 0 ? `<div class="project-tile-progress"><div style="width:${progressPercent}%"></div></div>` : ''}
                <div class="project-tile-meta">
                    <span class="project-tile-due${isOverdue ? ' overdue' : ''}">${card.dueDate ? '📅 ' + escapeHtml(dueRangeLabel(card)) : 'No date'}</span>
                    <span class="project-tile-assignee">${card.assignee ? (card.avatar || '👤') + ' ' + escapeHtml(card.assignee) : ''}</span>
                </div>
            </article>`;
        }

        // ==================== iOS 9 TOUCH CARD DRAG ====================
        // HTML5 drag-and-drop is not available for normal touch dragging on iOS 9.
        // This lightweight implementation uses touch events and changes the same
        // underlying board data used by desktop drag-and-drop.
        var TOUCH_DRAG = {
            card: null,
            cardId: null,
            fromCol: null,
            ghost: null,
            placeholder: null,
            startX: 0,
            startY: 0,
            lastX: 0,
            lastY: 0,
            timer: null,
            active: false,
            moved: false
        };

        function closestElement(el, selector) {
            while (el && el.nodeType === 1) {
                if (matchesSelector(el, selector)) return el;
                el = el.parentNode;
            }
            return null;
        }

        function matchesSelector(el, selector) {
            var fn = el.matches || el.msMatchesSelector || el.webkitMatchesSelector;
            if (fn) return fn.call(el, selector);
            var nodes = document.querySelectorAll(selector);
            for (var i = 0; i < nodes.length; i++) {
                if (nodes[i] === el) return true;
            }
            return false;
        }

        function setupTouchCardDrag() {
            var cards = document.querySelectorAll('.card[data-card-id]');
            for (var i = 0; i < cards.length; i++) {
                cards[i].addEventListener('touchstart', onTouchCardStart, false);
                cards[i].addEventListener('touchmove', onTouchCardMove, false);
                cards[i].addEventListener('touchend', onTouchCardEnd, false);
                cards[i].addEventListener('touchcancel', onTouchCardCancel, false);
            }
        }

        function onTouchCardStart(e) {
            if (TOUCH_DRAG.active) return;
            if (!e.touches || e.touches.length !== 1) return;

            var target = e.target;
            if (closestElement(target, 'button') || closestElement(target, 'input') ||
                closestElement(target, 'textarea') || closestElement(target, 'select') ||
                closestElement(target, 'a')) return;

            var card = closestElement(target, '.card[data-card-id]');
            if (!card) return;

            var touch = e.touches[0];
            TOUCH_DRAG.card = card;
            TOUCH_DRAG.cardId = card.getAttribute('data-card-id');
            var col = closestElement(card, '.column[data-column]');
            TOUCH_DRAG.fromCol = col ? col.getAttribute('data-column') : null;
            TOUCH_DRAG.startX = touch.clientX;
            TOUCH_DRAG.startY = touch.clientY;
            TOUCH_DRAG.lastX = touch.clientX;
            TOUCH_DRAG.lastY = touch.clientY;
            TOUCH_DRAG.moved = false;

            clearTimeout(TOUCH_DRAG.timer);
            TOUCH_DRAG.timer = setTimeout(function() {
                startTouchCardDrag();
            }, 220);
        }

        function startTouchCardDrag() {
            if (!TOUCH_DRAG.card || TOUCH_DRAG.active) return;

            TOUCH_DRAG.active = true;
            APP.draggingCard = TOUCH_DRAG.cardId;
            APP.draggingColumn = null;
            TOUCH_DRAG.card.classList.add('touch-dragging');

            TOUCH_DRAG.placeholder = document.createElement('div');
            TOUCH_DRAG.placeholder.className = 'touch-drag-placeholder';
            TOUCH_DRAG.card.parentNode.insertBefore(TOUCH_DRAG.placeholder, TOUCH_DRAG.card.nextSibling);

            TOUCH_DRAG.ghost = TOUCH_DRAG.card.cloneNode(true);
            TOUCH_DRAG.ghost.className = TOUCH_DRAG.card.className + ' touch-drag-ghost';
            TOUCH_DRAG.ghost.style.width = TOUCH_DRAG.card.offsetWidth + 'px';
            TOUCH_DRAG.ghost.style.left = (TOUCH_DRAG.startX - TOUCH_DRAG.card.offsetWidth / 2) + 'px';
            TOUCH_DRAG.ghost.style.top = (TOUCH_DRAG.startY - 25) + 'px';
            document.body.appendChild(TOUCH_DRAG.ghost);

            document.body.style.webkitUserSelect = 'none';
            document.body.style.userSelect = 'none';
            TOUCH_DRAG.card.style.visibility = 'hidden';
        }

        function onTouchCardMove(e) {
            if (!TOUCH_DRAG.card) return;
            var touch = e.touches && e.touches[0];
            if (!touch) return;

            TOUCH_DRAG.lastX = touch.clientX;
            TOUCH_DRAG.lastY = touch.clientY;

            var dx = touch.clientX - TOUCH_DRAG.startX;
            var dy = touch.clientY - TOUCH_DRAG.startY;
            if (Math.abs(dx) > 8 || Math.abs(dy) > 8) TOUCH_DRAG.moved = true;

            if (!TOUCH_DRAG.active) {
                if (TOUCH_DRAG.moved) clearTimeout(TOUCH_DRAG.timer);
                return;
            }

            e.preventDefault();

            if (TOUCH_DRAG.ghost) {
                TOUCH_DRAG.ghost.style.left =
                    (touch.clientX - TOUCH_DRAG.ghost.offsetWidth / 2) + 'px';
                TOUCH_DRAG.ghost.style.top =
                    (touch.clientY - 25) + 'px';
            }

            updateTouchDropTarget(touch.clientX, touch.clientY);
        }

        function updateTouchDropTarget(x, y) {
            if (!TOUCH_DRAG.placeholder) return;

            var el = document.elementFromPoint(x, y);
            if (!el) return;

            var targetCard = closestElement(el, '.card[data-card-id]');
            if (targetCard && targetCard !== TOUCH_DRAG.card &&
                targetCard !== TOUCH_DRAG.ghost) {
                var rect = targetCard.getBoundingClientRect();
                if (y < rect.top + rect.height / 2) {
                    targetCard.parentNode.insertBefore(TOUCH_DRAG.placeholder, targetCard);
                } else {
                    targetCard.parentNode.insertBefore(TOUCH_DRAG.placeholder, targetCard.nextSibling);
                }
                return;
            }

            var targetBody = closestElement(el, '.column-body[data-column-body]');
            if (targetBody) {
                targetBody.appendChild(TOUCH_DRAG.placeholder);
            }
        }

        function onTouchCardEnd(e) {
            clearTimeout(TOUCH_DRAG.timer);

            if (!TOUCH_DRAG.card) return;

            if (!TOUCH_DRAG.active) {
                resetTouchDrag();
                return;
            }

            /* A long press without movement is treated as a normal touch. */
            if (!TOUCH_DRAG.moved) {
                resetTouchDrag();
                return;
            }

            if (e) e.preventDefault();

            var cardId = TOUCH_DRAG.cardId;
            var fromCol = TOUCH_DRAG.fromCol;
            var placeholder = TOUCH_DRAG.placeholder;
            var toCol = null;
            var newIndex = -1;

            if (placeholder && placeholder.parentNode) {
                var body = closestElement(placeholder.parentNode, '.column-body[data-column-body]');
                if (body) {
                    toCol = body.getAttribute('data-column-body');
                    var children = body.children;
                    var i;
                    for (i = 0; i < children.length; i++) {
                        if (children[i] === placeholder) {
                            newIndex = i;
                            break;
                        }
                    }
                }
            }

            if (fromCol && toCol) {
                moveCardToPosition(cardId, fromCol, toCol, newIndex);
            }

            resetTouchDrag();
        }

        function onTouchCardCancel() {
            clearTimeout(TOUCH_DRAG.timer);
            resetTouchDrag();
        }

        function resetTouchDrag() {
            clearTimeout(TOUCH_DRAG.timer);

            if (TOUCH_DRAG.card) {
                TOUCH_DRAG.card.classList.remove('touch-dragging');
                TOUCH_DRAG.card.style.visibility = '';
            }

            if (TOUCH_DRAG.ghost && TOUCH_DRAG.ghost.parentNode) {
                TOUCH_DRAG.ghost.parentNode.removeChild(TOUCH_DRAG.ghost);
            }

            if (TOUCH_DRAG.placeholder && TOUCH_DRAG.placeholder.parentNode) {
                TOUCH_DRAG.placeholder.parentNode.removeChild(TOUCH_DRAG.placeholder);
            }

            document.body.style.webkitUserSelect = '';
            document.body.style.userSelect = '';

            TOUCH_DRAG.card = null;
            TOUCH_DRAG.cardId = null;
            TOUCH_DRAG.fromCol = null;
            TOUCH_DRAG.ghost = null;
            TOUCH_DRAG.placeholder = null;
            TOUCH_DRAG.active = false;
            TOUCH_DRAG.moved = false;
            APP.draggingCard = null;
        }

        function moveCardToPosition(cardId, fromCol, toCol, index) {
            var board = getBoard();
            if (!board || !board.cards[fromCol]) return;

            var oldIndex = -1;
            var i;
            for (i = 0; i < board.cards[fromCol].length; i++) {
                if (board.cards[fromCol][i].id === cardId) {
                    oldIndex = i;
                    break;
                }
            }
            if (oldIndex === -1) return;

            var card = board.cards[fromCol][oldIndex];
            board.cards[fromCol].splice(oldIndex, 1);

            if (!board.cards[toCol]) board.cards[toCol] = [];

            if (index < 0) index = board.cards[toCol].length;
            if (fromCol === toCol && oldIndex < index) index--;
            if (index < 0) index = 0;
            if (index > board.cards[toCol].length) index = board.cards[toCol].length;

            board.cards[toCol].splice(index, 0, card);

            if (fromCol !== toCol) {
                card.activity = card.activity || [];
                card.activity.push({
                    action: 'moved',
                    user: 'You',
                    time: new Date().toISOString(),
                    detail: 'from ' + (board.columns[fromCol] ? board.columns[fromCol].title : fromCol) +
                            ' to ' + (board.columns[toCol] ? board.columns[toCol].title : toCol)
                });
            }

            saveData();
            renderBoard();

            if (fromCol !== toCol) {
                showToast('Card moved to "' +
                    (board.columns[toCol] ? board.columns[toCol].title : toCol) + '"', 'info');
            }
        }

// ==================== DRAG AND DROP ====================
        function setupDragAndDrop() {
            // Card drag and drop
            document.querySelectorAll('.card[draggable]').forEach(function(card) {
                card.addEventListener('dragstart', onCardDragStart);
                card.addEventListener('dragend', onCardDragEnd);
            });

            // Column body drop zones
            document.querySelectorAll('.column-body').forEach(function(body) {
                body.addEventListener('dragover', onColumnDragOver);
                body.addEventListener('dragenter', onColumnDragEnter);
                body.addEventListener('dragleave', onColumnDragLeave);
                body.addEventListener('drop', onColumnDrop);
            });

            // Column drag and drop (reordering)
            document.querySelectorAll('.column[draggable]').forEach(function(col) {
                col.addEventListener('dragstart', onColumnDragStart);
                col.addEventListener('dragend', onColumnDragEnd);
                col.addEventListener('dragover', onColumnReorderDragOver);
                col.addEventListener('dragleave', onColumnReorderDragLeave);
                col.addEventListener('drop', onColumnReorderDrop);
            });
        }

        function onCardDragStart(e) {
            const card = closestElement(e.target, '.card');
            if (!card) return;

            e.stopPropagation();
            card.classList.add('dragging');
            APP.draggingCard = card.dataset.cardId;
            APP.draggingColumn = null;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', APP.draggingCard);

            setTimeout(function() {
                card.style.opacity = '0.5';
            }, 0);
        }

        function onCardDragEnd(e) {
            const card = closestElement(e.target, '.card');
            card.classList.remove('dragging');
            card.style.opacity = '1';
            document.querySelectorAll('.column').forEach(function(col) { col.classList.remove('drag-over'); });
            document.querySelectorAll('.card').forEach(function(c) { c.classList.remove('drag-over-target'); });
            APP.draggingCard = null;
        }

        function onColumnDragOver(e) {
            e.preventDefault();
            e.dataTransfer.effectAllowed = 'move';
        }

        function onColumnDragEnter(e) {
            e.preventDefault();
            const body = closestElement(e.target, '.column-body');
            if (body) {
                closestElement(body, '.column').classList.add('drag-over');
            }
        }

        function onColumnDragLeave(e) {
            const body = closestElement(e.target, '.column-body');
            if (body) {
                closestElement(body, '.column').classList.remove('drag-over');
            }
        }

        function onColumnDrop(e) {
            e.preventDefault();
            e.stopPropagation();

            const body = closestElement(e.target, '.column-body[data-column-body]');
            if (!body || !APP.draggingCard) return;

            const cardEl = document.querySelector(`.card[data-card-id="${APP.draggingCard}"]`);
            if (!cardEl) return;

            const toCol = body.dataset.columnBody;
            const fromColumnEl = closestElement(cardEl, '.column[data-column]');
            const fromCol = fromColumnEl ? fromColumnEl.dataset.column : null;
            if (!fromCol) return;

            if (fromCol !== toCol) {
                moveCard(APP.draggingCard, fromCol, toCol);
                showToast(`Card moved to "${getBoard().columns[toCol] ? getBoard().columns[toCol].title : toCol}"`, 'info');
            }

            document.querySelectorAll('.column').forEach(function(col) { col.classList.remove('drag-over'); });
        }

        function onColumnDragStart(e) {
            if (closestElement(e.target, '.card') || closestElement(e.target, '.add-card-form')) return;

            const col = closestElement(e.target, '.column[data-column]');
            if (!col || col.classList.contains('add-column-col')) return;

            e.stopPropagation();
            col.classList.add('drag-column');
            APP.draggingColumn = col.dataset.column;
            APP.draggingCard = null;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', APP.draggingColumn);
        }

        function onColumnDragEnd(e) {
            const col = closestElement(e.target, '.column');
            if (col) col.classList.remove('drag-column');
            document.querySelectorAll('.column.dragging-over').forEach(function(c) { c.classList.remove('dragging-over'); });
            document.querySelectorAll('.column-placeholder').forEach(function(p) { if (p.parentNode) p.parentNode.removeChild(p); });
            APP.draggingColumn = null;
        }

        function onColumnReorderDragOver(e) {
            if (!APP.draggingColumn || APP.draggingCard) return;
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            const col = closestElement(e.target, '.column[data-column]');
            if (!col || col.classList.contains('add-column-col')) return;
            if (col.dataset.column === APP.draggingColumn) return;

            const rect = col.getBoundingClientRect();
            const before = e.clientX < rect.left + rect.width / 2;
            document.querySelectorAll('.column').forEach(function(c) { c.classList.remove('dragging-over'); });
            col.classList.add('dragging-over');
            col.dataset.dropBefore = before ? 'true' : 'false';
        }

        function onColumnReorderDragLeave(e) {
            const col = closestElement(e.target, '.column[data-column]');
            if (col && !col.contains(e.relatedTarget)) col.classList.remove('dragging-over');
        }

        function onColumnReorderDrop(e) {
            if (!APP.draggingColumn || APP.draggingCard) return;
            const col = closestElement(e.target, '.column[data-column]');
            if (!col || col.classList.contains('add-column-col')) return;
            e.preventDefault();
            e.stopPropagation();

            const targetId = col.dataset.column;
            const dragId = APP.draggingColumn;
            if (targetId === dragId) return;

            const before = col.dataset.dropBefore === 'true';
            const board = getBoard();
            if (!board || !board.columns[dragId]) return;

            const visible = APP.columnOrder.filter(function(id) { return board.columns[id]; });
            const hidden = APP.columnOrder.filter(function(id) { return !board.columns[id]; });
            const current = visible.indexOf(dragId);
            if (current === -1) return;

            const order = visible.slice();
            order.splice(current, 1);
            let insertAt = order.indexOf(targetId);
            if (insertAt === -1) insertAt = order.length;
            if (!before) insertAt += 1;
            order.splice(insertAt, 0, dragId);

            // Persist the new order in the column order fields.
            order.forEach(function(id, index) {
                if (board.columns[id]) board.columns[id].order = index;
            });
            APP.columnOrder = order.concat(hidden);

            document.querySelectorAll('.column.dragging-over').forEach(function(c) { c.classList.remove('dragging-over'); });
            saveData();
            renderBoard();
            showToast('Column order updated', 'info');
        }
