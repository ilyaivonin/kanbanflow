        function renameColumn(colId, newTitle) {
            const board = getBoard();
            if (board.columns[colId]) {
                board.columns[colId].title = newTitle;
                saveData();
                renderBoard();
            }
        }

        function deleteColumn(colId) {
            const board = getBoard();
            const cardCount = (board.cards[colId] ? board.cards[colId].length : 0);
            if (cardCount > 0) {
                if (!confirm(`${cardCount} card(s) will be moved to "To Do". Continue?`)) return;
                const targetCol = Object.keys(board.columns).find(function(k) { return k !== colId; });
                if (targetCol) {
                    board.cards[targetCol] = (board.cards[targetCol] || []).concat(board.cards[colId]);
                }
            }
            delete board.columns[colId];
            delete board.cards[colId];
            if (board.separators) {
                board.separators = board.separators.filter(function(s) { return s.before !== colId; });
            }
            APP.columnOrder = APP.columnOrder.filter(function(c) { return c !== colId; });
            APP.completionColumns = (APP.completionColumns || []).filter(function(c) { return c !== colId; });
            saveData();
            renderBoard();
            showToast(`Column deleted`, 'info');
        }

        function duplicateColumn(colId) {
            const board = getBoard();
            if (!board || !board.columns[colId]) return;

            const source = board.columns[colId];
            const baseTitle = String(source.title || 'Column').replace(/\s*\(copy\)$/i, '');
            const newId = 'col_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
            const stamp = new Date().toISOString();

            board.columns[newId] = {
                title: baseTitle + ' (copy)',
                order: source.order || 0
            };

            board.cards[newId] = (board.cards[colId] || []).map(function(card) {
                const copy = JSON.parse(JSON.stringify(card));
                copy.id = 'card_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
                copy.activity = (copy.activity || []).concat([{
                    action: 'duplicated', user: 'You', time: stamp
                }]);
                return copy;
            });

            const visible = APP.columnOrder.filter(function(id) {
                return board.columns[id] && id !== newId;
            });
            const pos = visible.indexOf(colId);
            const insertAt = pos === -1 ? visible.length : pos + 1;
            const hidden = APP.columnOrder.filter(function(id) { return !board.columns[id]; });
            APP.columnOrder = visible.slice(0, insertAt).concat([newId], visible.slice(insertAt), hidden);

            saveData();
            renderBoard();
            showToast('Column duplicated', 'success');
        }

        function getCompletionColumns() {
            const board = getBoard();
            if (!board) return [];
            return (APP.completionColumns || []).filter(function(id) { return !!board.columns[id]; });
        }

        function defaultCompletionColumns() {
            const board = getBoard();
            if (!board) return [];
            const ordered = APP.columnOrder.filter(function(id) { return board.columns[id]; });
            if (!ordered.length) return [];

            const matched = ordered.filter(function(id) {
                return /done|complete|finished|готово|заверш/i.test(board.columns[id].title || '');
            });
            if (matched.length) return matched;
            return [ordered[ordered.length - 1]];
        }

        function completeCard(cardId, targetCol) {
            const result = getCard(cardId);
            if (!result || !targetCol) return;
            const board = getBoard();
            const card = result.card;
            const fromCol = result.column;
            const stamp = new Date().toISOString();

            card.completed = true;
            card.completedAt = stamp;
            card.activity = card.activity || [];
            card.activity.push({
                action: 'completed',
                user: 'You',
                time: stamp,
                detail: 'moved to ' + (board.columns[targetCol] ? board.columns[targetCol].title : targetCol)
            });

            if (fromCol !== targetCol) {
                const idx = board.cards[fromCol].indexOf(card);
                if (idx !== -1) board.cards[fromCol].splice(idx, 1);
                if (!board.cards[targetCol]) board.cards[targetCol] = [];
                board.cards[targetCol].push(card);
            }

            saveData();
            renderBoard();
            showToast('Task completed', 'success');
        }

        function uncompleteCard(cardId) {
            const result = getCard(cardId);
            if (!result) return;
            const card = result.card;
            delete card.completed;
            delete card.completedAt;
            card.activity = card.activity || [];
            card.activity.push({ action: 'uncompleted', user: 'You', time: new Date().toISOString() });

            saveData();
            closeModal();
            renderBoard();
            showToast('Completion removed', 'info');
        }

        var COMPLETE_MODAL = { cardId: null, firstTime: false };

        function updateCompleteTargets() {
            const select = document.getElementById('completeTarget');
            if (!select) return;
            const checks = document.querySelectorAll('.complete-col-check:checked');
            const previous = select.value;
            let html = '';
            for (let i = 0; i < checks.length; i++) {
                const id = checks[i].value;
                html += '<option value="' + id + '">' + escapeHtml(getBoard().columns[id] ? getBoard().columns[id].title : id) + '</option>';
            }
            select.innerHTML = html;
            if (previous && Array.prototype.some.call(select.options, function(o) { return o.value === previous; })) {
                select.value = previous;
            }
        }

        function showCompleteModal(cardId) {
            const result = getCard(cardId);
            if (!result) return;

            const card = result.card;
            const board = getBoard();
            const configured = getCompletionColumns();
            const firstTime = configured.length === 0;
            const ordered = APP.columnOrder.filter(function(id) { return board.columns[id]; });

            COMPLETE_MODAL.cardId = cardId;
            COMPLETE_MODAL.firstTime = firstTime;

            document.getElementById('modalTitle').textContent = card.completed ? 'Completed task' : 'Complete task';

            let body = '<div class="settings-hint" style="margin-bottom:12px;">' +
                escapeHtml(card.title) + '</div>';

                const defaults = defaultCompletionColumns();
                body += `
                    <div class="detail-section">
                        <div class="detail-section-title">Completion columns</div>
                        <div class="settings-hint">Tick the columns a completed task may be moved to (for example Done). You can change this later in Settings.</div>
                        <div id="completeColumnChecks">
                            ${ordered.map(function(cid) {
                                return '<label class="complete-option">' +
                                    '<input type="checkbox" class="complete-col-check" value="' + cid + '"' +
                                    (defaults.indexOf(cid) !== -1 ? ' checked' : '') +
                                    ' onchange="updateCompleteTargets()">' +
                                    '<span>' + escapeHtml(board.columns[cid].title) + '</span></label>';
                            }).join('')}
                        </div>
                    </div>
                    <div class="detail-section">
                        <div class="detail-section-title">Move this task to</div>
                        <select class="detail-input" id="completeTarget"></select>
                    </div>
                `;
            } else {
                const current = configured.indexOf(result.column) !== -1 ? result.column : configured[0];
                body += `
                    <div class="detail-section">
                        <div class="detail-section-title">Move this task to</div>
                        <div class="settings-hint">Only the columns selected earlier or in Settings are shown.</div>
                        <div id="completeColumnChecks">
                            ${configured.map(function(cid) {
                                return '<label class="complete-option">' +
                                    '<input type="radio" name="completeTarget" value="' + cid + '"' +

            document.getElementById('modalBody').innerHTML = body;

            }
            footer += '<button class="btn btn-primary" onclick="confirmComplete()">' +
                (card.completed ? 'Move / Save' : 'Complete') + '</button>';
            document.getElementById('modalFooter').innerHTML = footer;

            if (firstTime) updateCompleteTargets();
            showModal();
        }

        function confirmComplete() {
            const cardId = COMPLETE_MODAL.cardId;
            if (!cardId) return;
            let target;

            if (COMPLETE_MODAL.firstTime) {
                const checks = document.querySelectorAll('.complete-col-check:checked');
                if (!checks.length) {
                    showToast('Select at least one completion column', 'error');
                    return;
                }
                const chosen = [];
                for (let i = 0; i < checks.length; i++) chosen.push(checks[i].value);
                APP.completionColumns = chosen;
                const select = document.getElementById('completeTarget');
                target = select ? select.value : chosen[0];
                if (chosen.indexOf(target) === -1) target = chosen[0];
            } else {
                const selected = document.querySelector('input[name="completeTarget"]:checked');
                if (!selected) {
                    showToast('Select a target column', 'error');
                    return;
                }
                target = selected.value;
            }

            closeModal();
            completeCard(cardId, target);
        }
