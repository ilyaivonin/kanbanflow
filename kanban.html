        function resetFilters() {
            APP.searchQuery = '';
            APP.activeFilters = { labels: [], assignees: [], priorities: [] };

            const search = document.getElementById('searchInput');
            if (search) search.value = '';

            const filterBtn = document.getElementById('filterBtn');
            if (filterBtn) filterBtn.classList.remove('active');
            const assigneeBtn = document.getElementById('assigneeFilterBtn');
            if (assigneeBtn) assigneeBtn.classList.remove('active');

            updateFilterUI();
            renderBoard();
            showToast('Filters reset', 'info');
        }

        // ==================== FILTER MODAL ====================
        function showFilterModal(focusGroup) {
            const board = getBoard();
            const labels = ['red', 'green', 'blue', 'yellow', 'purple'];
            const priorities = ['high', 'medium', 'low'];
            const assignees = [];

            if (board) {
                Object.keys(board.cards || {}).forEach(function(colId) {
                    (board.cards[colId] || []).forEach(function(card) {
                        if (card.assignee && assignees.indexOf(card.assignee) === -1) assignees.push(card.assignee);
                    });
                });
            }
            assignees.sort();

            function check(group, value) {
                return APP.activeFilters[group].indexOf(value) !== -1 ? ' checked' : '';
            }

            document.getElementById('modalTitle').textContent = 'Filter Cards';
            document.getElementById('modalBody').innerHTML = `
                <div class="filter-section">
                    <div class="detail-section-title">Labels</div>
                    <div class="filter-options">
                        ${labels.map(function(label) {
                            return `<label class="filter-check"><input type="checkbox" data-filter-group="labels" value="${label}"${check('labels', label)}><span class="filter-dot label-${label}"></span>${label}</label>`;
                        }).join('')}
                    </div>
                </div>
                <div class="filter-section">
                    <div class="detail-section-title">Priorities</div>
                    <div class="filter-options">
                        ${priorities.map(function(priority) {
                            return `<label class="filter-check"><input type="checkbox" data-filter-group="priorities" value="${priority}"${check('priorities', priority)}>${priority}</label>`;
                        }).join('')}
                    </div>
                </div>
                <div class="filter-section">
                    <div class="detail-section-title">Assignees</div>
                    ${assignees.length ? `<div class="filter-options">
                        ${assignees.map(function(assignee) {
                            return `<label class="filter-check"><input type="checkbox" data-filter-group="assignees" value="${escapeHtml(assignee)}"${check('assignees', assignee)}>${escapeHtml(assignee)}</label>`;
                        }).join('')}
                    </div>` : '<div class="filter-empty">No assignees on this board yet.</div>'}
                </div>
            `;
            document.getElementById('modalFooter').innerHTML =
                '<button class="btn" onclick="clearFilterModal()">Clear</button>' +
                '<button class="btn btn-primary" onclick="applyFilterModal()">Apply Filters</button>';

            showModal();

            if (focusGroup) {
                setTimeout(function() {
                    const first = document.querySelector('.filter-check input[data-filter-group="' + focusGroup + '"]');
                    if (first) first.focus();
                }, 100);
            }
        }

        function clearFilterModal() {
            document.querySelectorAll('#modalBody .filter-check input').forEach(function(input) {
                input.checked = false;
            });
        }

        function applyFilterModal() {
            const next = { labels: [], assignees: [], priorities: [] };
            document.querySelectorAll('#modalBody .filter-check input:checked').forEach(function(input) {
                const group = input.getAttribute('data-filter-group');
                if (next[group]) next[group].push(input.value);
            });

            APP.activeFilters = next;

            const filterBtn = document.getElementById('filterBtn');
            if (filterBtn) filterBtn.classList.toggle('active', next.labels.length > 0 || next.priorities.length > 0);
            const assigneeBtn = document.getElementById('assigneeFilterBtn');
            if (assigneeBtn) assigneeBtn.classList.toggle('active', next.assignees.length > 0);

            updateFilterUI();
            closeModal();
            renderBoard();
            showToast('Filters applied', 'info');
        }

        // ==================== BOARD HORIZONTAL SCROLL ====================
        function setupBoardScroll() {
            const container = document.getElementById('boardContainer');
            if (!container || container.getAttribute('data-scroll-bound') === '1') return;
            container.setAttribute('data-scroll-bound', '1');

            // A plain vertical mouse wheel pans the board sideways, unless the
            // pointer is over a card list that can still scroll vertically.
            container.addEventListener('wheel', function(e) {
                if (e.ctrlKey || e.metaKey || e.shiftKey) return;
                if (Math.abs(e.deltaX) >= Math.abs(e.deltaY)) return;
                if (container.scrollWidth <= container.clientWidth) return;

                const inner = closestElement(e.target, '.column-body');
                if (inner && inner.scrollHeight > inner.clientHeight + 1) return;

                container.scrollLeft += e.deltaY;
                e.preventDefault();
            }, false);
        }

        // ==================== TOAST NOTIFICATIONS ====================
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <span>${message}</span>
            `;
            container.appendChild(toast);

            setTimeout(function() {
                toast.style.animation = 'slideOut 0.3s ease forwards';
                setTimeout(function() { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 300);
            }, 3000);
        }

        // ==================== THEME TOGGLE ====================
        function cycleTheme() {
            const themes = ['dark', 'light', 'blue', 'green'];
            const currentIndex = themes.indexOf(APP.currentTheme);
            const nextIndex = (currentIndex + 1) % themes.length;
            APP.currentTheme = themes[nextIndex];
            document.body.setAttribute('data-theme', APP.currentTheme);
            saveData();
        }

        // ==================== KEYBOARD SHORTCUTS ====================
        function setupKeyboardShortcuts() {
            document.addEventListener('keydown', function(e) {
                if (e.key === '/' && !e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey) {
                    const active = document.activeElement;
                    const typing = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' ||
                        active.tagName === 'SELECT' || active.isContentEditable);
                    const modalOpen = document.getElementById('modalOverlay').classList.contains('active');
                    if (!typing && !modalOpen) {
                        e.preventDefault();
                        const searchInput = document.getElementById('searchInput');
                        if (searchInput) searchInput.focus();
                    }
                }

                if (e.key === 'Escape') {
                    if (DATE_PICKER.input) {
                        e.preventDefault();
                        closeDatePicker();
                        return;
                    }
                    closeModal();
                    setBoardSwitcherOpen(false);
                    document.querySelectorAll('.add-card-input').forEach(function(el) { if (el.parentNode) el.parentNode.removeChild(el); });
                }

                // Ctrl/Cmd shortcuts. Shift is reserved for the native menu
                // equivalents (Cmd+Shift+E export, Cmd+Shift+I import).
                if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey) {
                    switch (e.key.toLowerCase()) {
                        case 'n':
                            e.preventDefault();
                            var btn = document.querySelector('.add-card-btn'); if (btn) btn.click();
                            break;
                        case 'b':
                            e.preventDefault();
                            showNewBoardModal();
                            break;
                        case 'e':
                            e.preventDefault();
                            exportBoard();
                            break;
                        case 't':
                            e.preventDefault();
                            cycleTheme();
                            break;
                        case 'k':
                            e.preventDefault();
                            document.getElementById('shortcutsBtn').click();
                            break;
                        case ',':
                            e.preventDefault();
                            showSettingsModal();
                            break;
                        case 'z':
                            // Let focused inputs use the browser's own text undo.
                            if (!isTypingContext()) {
                                e.preventDefault();
                                performUndo();
                            }
                            break;
                    }
                }

                // Number keys for column navigation
                if (!e.ctrlKey && !e.metaKey) {
                    if (e.key >= '1' && e.key <= '9') {
                        const cols = APP.columnOrder.map(function(id) { return document.querySelector('[data-column="' + id + '"]'); });
                        const idx = parseInt(e.key) - 1;
                        if (cols[idx]) {
                            cols[idx].scrollIntoView(false);
                        }
                    }
                }
            });
        }

        // ==================== EVENT LISTENERS ====================
        function positionBoardDropdown() {
            const dropdown = document.getElementById('boardDropdown');
            const toggle = document.getElementById('boardSwitcherToggle');
            if (!dropdown || !toggle) return;

            const rect = toggle.getBoundingClientRect();
            const width = Math.min(320, Math.max(230, window.innerWidth - 16));
            const left = Math.min(Math.max(8, rect.left), window.innerWidth - width - 8);
            const top = Math.round(rect.bottom + 6);

            dropdown.style.position = 'fixed';
            dropdown.style.left = Math.round(left) + 'px';
            dropdown.style.top = top + 'px';
            dropdown.style.width = width + 'px';
            dropdown.style.maxHeight = Math.max(140, window.innerHeight - top - 16) + 'px';
        }

        function setBoardSwitcherOpen(open) {
            const switcher = document.getElementById('boardSwitcher');
            const toggle = document.getElementById('boardSwitcherToggle');
            if (!switcher || !toggle) return;

            switcher.classList.toggle('open', !!open);
            toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
            if (open) positionBoardDropdown();
        }

        function setupEventListeners() {
            // Board switcher dropdown: clicking the hamburger opens the list.
            // pointerdown.preventDefault keeps focus (and the caret) out of
            // the search field; the menu is positioned as a fixed panel so it
            // can never overlap or "jump" to the search input.
            const switcher = document.getElementById('boardSwitcher');
            const switcherToggle = document.getElementById('boardSwitcherToggle');

            switcherToggle.addEventListener('pointerdown', function(e) {
                e.preventDefault();
            });

            switcherToggle.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                setBoardSwitcherOpen(!switcher.classList.contains('open'));
            });

            switcher.querySelector('.header-btn').addEventListener('click', function(e) {
                e.stopPropagation();
            });

            document.addEventListener('pointerdown', function(e) {
                if (switcher && !switcher.contains(e.target)) setBoardSwitcherOpen(false);
            }, true);

            window.addEventListener('resize', function() {
                if (switcher.classList.contains('open')) positionBoardDropdown();
            });

            document.getElementById('boardDropdownList').addEventListener('click', function(e) {
                const del = closestElement(e.target, '.board-dropdown-del');
                if (del) {
                    const id = del.getAttribute('data-delete-board');
                    if (id && confirm('Delete this board?')) {
                        deleteBoard(id);
                    }
                    return;
                }

                const item = closestElement(e.target, '.board-dropdown-pick');
                if (!item) return;
                const id = item.getAttribute('data-board-id');
                setBoardSwitcherOpen(false);
                if (id && id !== APP.currentBoard) switchBoard(id);
            });

            // Board tabs: a new board appears to the right of the previous one
            document.getElementById('boardTabs').addEventListener('click', function(e) {
                const tab = closestElement(e.target, '.board-tab');
                if (!tab) return;
                const id = tab.getAttribute('data-board-id');
                if (id && id !== APP.currentBoard) switchBoard(id);
            });

            // New board (both the "+" button and the dropdown entry)
            function promptNewBoard() {
                setBoardSwitcherOpen(false);
                showNewBoardModal();
            }
            document.getElementById('newBoardBtn').addEventListener('click', promptNewBoard);
            document.getElementById('newBoardBtn2').addEventListener('click', promptNewBoard);

            // Theme toggle
            document.getElementById('themeBtn').addEventListener('click', cycleTheme);

            // Search
            document.getElementById('searchInput').addEventListener('input', function(e) {
                APP.searchQuery = e.target.value;
                updateFilterUI();
                renderBoard();
            });

            // Filter modal (labels + priorities + assignees)
            document.getElementById('filterBtn').addEventListener('click', function() {
                showFilterModal('labels');
            });

            document.getElementById('assigneeFilterBtn').addEventListener('click', function() {
                showFilterModal('assignees');
            });

            // Reset filters (right of the filter buttons)
            document.getElementById('resetFiltersBtn').addEventListener('click', resetFilters);

            // Add a date divider between columns
            document.getElementById('addSeparatorBtn').addEventListener('click', function() {
                showSeparatorModal(null, 'end');
            });

            // Horizontal board scrolling with a vertical mouse wheel
            setupBoardScroll();

            // Custom calendar for all card date fields
            setupDatePickers();

            // Undo the last board/database change
            document.getElementById('undoBtn').addEventListener('click', performUndo);

            // Settings (app name + database)
            document.getElementById('settingsBtn').addEventListener('click', showSettingsModal);

            // Import/Export
            document.getElementById('importExportBtn').addEventListener('click', function() {
                showImportExportModal();
            });

            // Shortcuts modal
            document.getElementById('shortcutsBtn').addEventListener('click', function() {
                showShortcutsModal();
            });

            // Modal close
            document.getElementById('modalClose').addEventListener('click', closeModal);

            // Modal overlay click
            document.getElementById('modalOverlay').addEventListener('click', function(e) {
                if (e.target === e.currentTarget) {
                    closeModal();
                }
            });

            // File import
            const fileInput = document.getElementById('fileImportInput');
            if (fileInput) {
                fileInput.addEventListener('change', function(e) {
                    if (e.target.files[0]) {
                        importBoard(e.target.files[0]);
                    }
                });
            }
        }

        function showSettingsModal() {
            const board = getBoard();
            const ordered = board ? APP.columnOrder.filter(function(id) { return board.columns[id]; }) : [];
            const selected = getCompletionColumns();

            document.getElementById('modalTitle').textContent = 'Settings';
            document.getElementById('modalBody').innerHTML = `
                <div class="settings-section">
                    <div class="settings-title">Application name</div>
                    <input type="text" class="detail-input" id="settingsAppName" maxlength="40" value="${escapeHtml(APP.appName || 'KanbanFlow')}" placeholder="KanbanFlow">
                    <div class="settings-hint">Shown in the header, the macOS window title and exported backups.</div>
                </div>
                <div class="settings-section">
                    <div class="settings-title">Completion columns</div>
                    <div class="settings-hint">Columns a finished task can be moved to. The Finish button offers only these.</div>
                    ${ordered.length
                        ? '<div id="settingsCompletionColumns">' + ordered.map(function(cid) {
                            return '<label class="complete-option">' +
                                '<input type="checkbox" class="settings-completion-check" value="' + cid + '"' +
                                (selected.indexOf(cid) !== -1 ? ' checked' : '') + '>' +
                                '<span>' + escapeHtml(board.columns[cid].title) + '</span></label>';
                        }).join('') + '</div>'
                        : '<div class="settings-hint">Add a column first.</div>'}
                </div>
                <div class="settings-section">
                    <div class="settings-title">Reset</div>
                    <div class="settings-hint">Restores the default application name, dark theme, board view, search and filters. Boards, columns and cards are kept.</div>
                    <div class="settings-actions">
                        <button class="import-export-btn" onclick="resetSettings()">Reset Settings</button>
                    </div>
                </div>
                <div class="settings-section">
                    <div class="settings-title">Database</div>
                    <div id="dbInfoPanel">
                        <div class="settings-hint">Reading database information…</div>
                    </div>
                    <div class="settings-actions">
                        <button class="import-export-btn" onclick="DB.reveal()">Reveal Database</button>
                        <button class="import-export-btn" onclick="exportAllBoards()">Backup to File</button>
                        <button class="import-export-btn" onclick="DB.importJSON()">Restore from File</button>
                    </div>
                </div>
            `;
            document.getElementById('modalFooter').innerHTML =
                '<button class="btn" onclick="closeModal()">Cancel</button>' +
                '<button class="btn btn-primary" onclick="saveSettingsModal()">Save Settings</button>';

            showModal();
            DB.requestInfo(updateDbInfoPanel);
        }

        function saveSettingsModal() {
            const input = document.getElementById('settingsAppName');
            const name = input ? input.value.trim() : '';
            if (!name) {
                showToast('Please enter an application name', 'error');
                return;
            }
            const checks = document.querySelectorAll('.settings-completion-check:checked');
            const chosen = [];
            for (let i = 0; i < checks.length; i++) chosen.push(checks[i].value);
            APP.completionColumns = chosen;

            applyAppName(name, true);
            closeModal();
            showToast('Settings saved to database', 'success');
        }

        function resetSettings() {
            const confirmed = window.confirm(
                'Reset application settings?\n\n' +
                'This restores the default name, dark theme, board view, search and filters. ' +
                'Boards, columns, cards and dividers are kept.'
            );
            if (!confirmed) return;

            APP.appName = 'KanbanFlow';
            APP.currentTheme = 'dark';
            APP.view = 'board';
            APP.searchQuery = '';
            APP.calendarCursor = null;
            APP.activeFilters = { labels: [], assignees: [], priorities: [] };

            document.body.setAttribute('data-theme', APP.currentTheme);
            applyAppName(APP.appName, false);
            saveData();

            const search = document.getElementById('searchInput');
            if (search) search.value = '';
            updateFilterUI();
            updateViewVisibility();
            updateBoardSelect();
            renderBoard();
            closeModal();
            showToast('Settings reset to defaults', 'success');
        }

        function showNewBoardModal() {
            const body = document.getElementById('modalBody');
            const title = document.getElementById('modalTitle');
            const footer = document.getElementById('modalFooter');

            title.textContent = 'New Board';
            body.innerHTML = `
                <div class="detail-section">
                    <div class="detail-section-title">Board name</div>
                    <input type="text" class="detail-input" id="newBoardName" maxlength="60" placeholder="e.g. Sprint 12">
                </div>
                <div class="detail-label">The new board opens as an active tab to the right of the current one.</div>
            `;
            footer.innerHTML = '<button class="btn" onclick="closeModal()">Cancel</button>' +
                '<button class="btn btn-primary" onclick="submitNewBoard()">Create Board</button>';

            showModal();
            setTimeout(function() { var el = document.getElementById('newBoardName'); if (el) el.focus(); }, 100);
        }

        function submitNewBoard() {
            const input = document.getElementById('newBoardName');
            const name = input ? input.value.trim() : '';
            if (!name) {
                showToast('Please enter a board name', 'error');
                return;
            }
            closeModal();
            createBoard(name);
        }

        function showImportExportModal() {
            const overlay = document.getElementById('modalOverlay');
            const body = document.getElementById('modalBody');
            const title = document.getElementById('modalTitle');
            const footer = document.getElementById('modalFooter');

            title.textContent = 'Import / Export';

            body.innerHTML = `
                <div class="db-card" style="margin-bottom:14px;">
                    <div><strong>${escapeHtml(APP.appName || 'KanbanFlow')}</strong></div>
                    <div class="settings-hint" style="margin-top:4px;">
                        Everything is stored in the database: ${Object.keys(APP.boards).length} board(s),
                        ${countStoredCards()} card(s), ${countStoredSeparators()} divider(s).
                    </div>
                </div>
                <div class="settings-title">Whole database</div>
                <div class="import-export-row">
                    <button class="import-export-btn" onclick="exportAllBoards()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 3v12"/>
                            <path d="M7 10l5 5 5-5"/>
                            <path d="M4 21h16"/>
                        </svg>
                        Export Full Backup (JSON)
                    </button>
                    <button class="import-export-btn" onclick="DB.importJSON()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 3v12"/>
                            <path d="M7 10l5 5 5-5"/>
                            <path d="M4 21h16"/>
                        </svg>
                        Import Backup (JSON)
                    </button>
                </div>
                <div class="settings-title" style="margin-top:16px;">One board</div>
                <div class="import-export-row">
                    <button class="import-export-btn" onclick="exportBoard()">Export Current Board</button>
                    <label class="import-export-btn" style="cursor:pointer;">
                        Import Board
                        <input type="file" class="file-input" accept=".json" id="fileImportInput" onchange="handleFileImport(event)">
                    </label>
                </div>
                <div class="settings-hint" style="margin-top:10px;">
                    A full backup contains every board, divider, card and the application name. Importing it replaces the current database contents.
                </div>
            `;

            footer.innerHTML = `<button class="btn" onclick="closeModal()">Close</button>`;

            showModal();
        }

        function handleFileImport(event) {
            const file = event.target.files[0];
            if (file) importBoard(file);
        }

        function handleFileImportAll(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    applyImportedState(e.target.result, false);
                    event.target.value = '';
                } catch (err) {
                    showToast('Invalid file format: ' + err.message, 'error');
                }
            };
            reader.readAsText(file);
        }

        function exportAllBoards() {
            const state = buildStateSnapshot();
            const safeName = (APP.appName || 'kanbanflow').replace(/[^a-z0-9_-]+/gi, '_');
            DB.exportJSON(state, safeName + '_backup_' + Date.now() + '.json');
            showToast('Full backup exported', 'success');
        }

        function showShortcutsModal() {
            const overlay = document.getElementById('modalOverlay');
            const body = document.getElementById('modalBody');
            const title = document.getElementById('modalTitle');
            const footer = document.getElementById('modalFooter');

            title.textContent = 'Keyboard Shortcuts';

            body.innerHTML = `
                <div class="shortcut-grid">
                    <div class="shortcut-item">
                        <span class="shortcut-key">Ctrl + Z</span>
                        <span class="shortcut-desc">Undo Last Action</span>
                    </div>
                    <div class="shortcut-item">
                        <span class="shortcut-key">Ctrl + N</span>
                        <span class="shortcut-desc">New Card</span>
                    </div>
                    <div class="shortcut-item">
                        <span class="shortcut-key">Ctrl + B</span>
                        <span class="shortcut-desc">New Board</span>
                    </div>
                    <div class="shortcut-item">
                        <span class="shortcut-key">Ctrl + E</span>
                        <span class="shortcut-desc">Export Board</span>
                    </div>
                    <div class="shortcut-item">
                        <span class="shortcut-key">Ctrl + T</span>
                        <span class="shortcut-desc">Toggle Theme</span>
                    </div>
                    <div class="shortcut-item">
                        <span class="shortcut-key">Ctrl + K</span>
                        <span class="shortcut-desc">Shortcuts</span>
                    </div>
                    <div class="shortcut-item">
                        <span class="shortcut-key">/</span>
                        <span class="shortcut-desc">Focus Search</span>
                    </div>
                    <div class="shortcut-item">
                        <span class="shortcut-key">Esc</span>
                        <span class="shortcut-desc">Close Modal</span>
                    </div>
                    <div class="shortcut-item">
                        <span class="shortcut-key">1-9</span>
                        <span class="shortcut-desc">Navigate Columns</span>
                    </div>
                </div>
            `;

            footer.innerHTML = `<button class="btn" onclick="closeModal()">Close</button>`;

            showModal();
        }

        // ==================== UTILITY FUNCTIONS ====================
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function truncate(str, len) {
            if (str.length <= len) return str;
            return str.substring(0, len) + '...';
        }

        // ==================== INIT ====================
        document.addEventListener('DOMContentLoaded', init);

        // ==================== SERVICE WORKER FOR OFFLINE ====================
        // Basic offline support
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('data:text/javascript,').catch(function() {});
        }
    </script>
</body>
</html>
